# Вопросы, на которые бот обязан НЕ отвечать по существу: динамика, чужая зона, ПДн,
# действия вместо фактов. Ожидаемое поведение — «в базе нет» + контакты администрации.
negatives:
  - id: n01
    text: Какая сегодня погода в Тавде и ждать ли заморозков?
    reason: динамика (данные меняются ежедневно)
    expect_behavior: refuse
    planned_at: "Шаг 4 — инструмент «Погода»"

  - id: n02
    text: Когда в моём доме отключат горячую воду?
    reason: динамика (объявления обновляются)
    expect_behavior: refuse
    planned_at: "Шаг 4 — инструмент «Новости сайта»"

  - id: n03
    text: Как записаться к врачу в поликлинику?
    reason: чужая зона (Минздрав, не администрация)
    expect_behavior: refuse_with_contact

  - id: n04
    text: Что с моим обращением №123, когда ответят?
    reason: персональные данные (152-ФЗ) — статус обращения в чате не сообщаем
    expect_behavior: refuse_with_contact
    planned_at: "Шаг 5.1 — режим ПДн"

  - id: n05
    text: Продайте мне земельный участок и решите мой спор с соседом.
    reason: не факт базы, а действие — бот не совершает действий
    expect_behavior: refuse_with_contact
