# Набор вопросов для оценки качества ответов ИИ-ассистента (материал Шага 6).
# Источник: заметка вольта «Шаг-2-Вопросы-Жителей» (черновик v1, 10.09.2026) —
# вопросы собраны из реальных разделов adm-tavda.ru, проверено 10.09.2026.
#
# Поля:
#   status:  ready   — факты карточки внесены в черновик базы знаний;
#            planned — вопрос в списке, факты ещё собираются на Шаге 2.
#   source:  раздел-источник на adm-tavda.ru (у карточки обязателен источник + дата проверки).
#   expect:  что обязано быть в ответе (факты, проверка без учёта регистра).
#   forbid:  чего в ответе быть не должно (типовые ошибки-ловушки из заметки Шага 2).
#
# Вопросы со status: planned сейчас получают честное «не знаю» + контакты — это норма,
# а не сбой. Доля таких ответов и есть метрика наполненности базы.

version: 1
checked: 2026-09-10

questions:
  - id: q01
    text: Как записаться на личный приём к главе округа?
    status: ready
    card: knowledge/faq/priem-grazhdan.md
    source: https://adm-tavda.ru/content/obrashcheniya-grazhdan
    expect: ["понедельник", "5-28-15"]
    forbid: ["до 13:00"]   # ловушка: склейка с графиком работы управления делами

  - id: q02
    text: Как записаться на приём участнику СВО или члену семьи?
    status: ready
    card: knowledge/faq/priem-grazhdan.md
    source: https://adm-tavda.ru/content/obrashcheniya-grazhdan + объявление sam_svo_200.jpg
    expect: ["среда", "5-28-15"]
    note: факт существует только картинкой-объявлением — перенесён в текст карточки

  - id: q03
    text: Как написать обращение в администрацию и в какой срок ответят?
    status: ready
    card: knowledge/faq/obrashcheniya.md
    source: https://adm-tavda.ru/content/obrashcheniya-grazhdan
