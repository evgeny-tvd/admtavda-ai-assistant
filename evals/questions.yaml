  - id: q05
    text: Как связаться с администрацией (телефон, почта, адрес)?
    status: ready
    card: knowledge/faq/kontakty.md
    source: https://adm-tavda.ru/ (подвал сайта)
    expect: ["5-00-00", "tavda@egov66.ru"]

  - id: q06
    text: Кто глава округа и его заместители?
    status: planned
